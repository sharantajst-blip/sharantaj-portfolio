<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শরণ তাজ - প্রফেশনাল পোর্টফোলিও</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.65);
            --text-dark: #0f172a;
            --text-muted: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', 'SolaimanLipi', sans-serif;
            color: var(--text-dark);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
            background: #eef2ff;
            position: relative;
        }

        /* Animated Mesh Gradient Background */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: 
                radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.35) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(236, 72, 153, 0.32) 0px, transparent 50%),
                radial-gradient(at 75% 85%, rgba(6, 182, 212, 0.35) 0px, transparent 50%),
                radial-gradient(at 20% 80%, rgba(16, 185, 129, 0.28) 0px, transparent 50%);
            background-size: 140% 140%;
            animation: meshMove 14s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 20% 100%; }
        }

        /* Floating Animated Geometric Blobs */
        .floating-blobs span {
            position: fixed;
            border-radius: 50%;
            filter: blur(55px);
            z-index: -1;
            opacity: 0.5;
            pointer-events: none;
            animation: blobFloat 18s infinite ease-in-out alternate;
        }

        .floating-blobs span:nth-child(1) {
            width: 320px; height: 320px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            top: -80px; left: -60px;
        }

        .floating-blobs span:nth-child(2) {
            width: 380px; height: 380px;
            background: linear-gradient(135deg, #5f27cd, #48dbfb);
            bottom: -100px; right: -80px;
            animation-delay: 3s;
        }

        @keyframes blobFloat {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            100% { transform: translate(45px, -45px) rotate(25deg) scale(1.12); }
        }

        /* Modern Hero Header */
        .hero-banner {
            background: linear-gradient(125deg, #4f46e5, #9333ea, #ec4899, #06b6d4);
            background-size: 300% 300%;
            animation: gradientFlow 9s ease infinite;
            padding: 55px 20px 65px;
            text-align: center;
            color: #ffffff;
            position: relative;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 88%, 50% 100%, 0 88%);
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.25);
        }
